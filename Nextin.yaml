x-nextin:
  version: 1
  mode: template

proxies: []

proxy-groups:
  - name: "节点选择"
    type: select
    include-all-proxies: true
    filter: "(?i)香港|日本|台湾|新加坡|HK|JP|TW|SG|狮城|🇭🇰|🇯🇵|🇹🇼|🇸🇬"
    exclude-filter: "(?i)(倍率|剩余|到期|官网|流量|3x|5x|Traffic|Expire)"
    proxies:
      - "日台新-手动"
      - "香港-手动"
      - "新加坡-手动"
      - "DIRECT"

  - name: "香港-手动"
    type: select
    include-all-proxies: true
    filter: "(?i)香港|HK|🇭🇰"
    exclude-filter: "(?i)(倍率|剩余|到期|官网|流量|3x|5x|Traffic|Expire)"

  - name: "日台新-手动"
    type: select
    include-all-proxies: true
    filter: "(?i)日本|台湾|新加坡|JP|TW|SG|狮城|🇯🇵|🇹🇼|🇸🇬"
    exclude-filter: "(?i)(倍率|剩余|到期|官网|流量|3x|5x|Traffic|Expire)"

  - name: "新加坡-手动"
    type: select
    include-all-proxies: true
    filter: "(?i)新加坡|SG|狮城|🇸🇬"
    exclude-filter: "(?i)(倍率|剩余|到期|官网|流量|3x|5x|Traffic|Expire)"

  - name: "AI"
    type: select
    proxies:
      - "日台新-手动"
      - "香港-手动"
      - "新加坡-手动"
      - "节点选择"

  - name: "Spotify"
    type: select
    proxies:
      - "日台新-手动"
      - "香港-手动"
      - "新加坡-手动"
      - "节点选择"

rules:
  # 1. 核心基础设施：确保 GeoData 数据库与 GitHub 正常更新
  - DOMAIN-SUFFIX,github.com,节点选择
  - DOMAIN-SUFFIX,githubusercontent.com,节点选择
  - DOMAIN-SUFFIX,jsdelivr.net,节点选择
  - DOMAIN-KEYWORD,github,节点选择

  # 2. Spotify 专项规则（优先指向新加坡手动组）
  - GEOSITE,spotify,Spotify
  - DOMAIN-SUFFIX,spotify.com,Spotify
  - DOMAIN-SUFFIX,scdn.co,Spotify
  - DOMAIN-KEYWORD,spotify,Spotify

  # 3. AI 专项规则（集中指向 AI 组 -> 默认日台新手动组）
  - GEOSITE,openai,AI
  - DOMAIN-KEYWORD,openai,AI

  - GEOSITE,anthropic,AI
  - DOMAIN-KEYWORD,anthropic,AI
  - DOMAIN-KEYWORD,claude,AI

  - DOMAIN-SUFFIX,perplexity.ai,AI
  - DOMAIN-SUFFIX,copilot.microsoft.com,AI

  # 4. 国内域名直连（纯域名匹配，不提前触发 DNS 解析）
  - GEOSITE,CN,DIRECT

  # 5. IP 规则放最后，避免干扰域名分流
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT

  # 6. 兜底规则
  - MATCH,节点选择
