x-nextin:
  version: 1
  mode: template

proxies: []

proxy-groups:
  - name: "节点选择"
    type: select
    include-all-proxies: true
    filter: "(?i)香港|日本|台湾|新加坡|HK|JP|TW|SG|狮城|🇭🇰|🇯🇵|🇹🇼|🇸🇬"
    exclude-filter: "(?i)(倍率|剩余|到期|官网|流量|3x|5x|Traffic|Expire)"
    proxies:
      - "香港-自动测速"
      - "DIRECT"

  - name: "香港-自动测速"
    type: url-test
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    include-all-proxies: true
    filter: "(?i)香港|HK|🇭🇰"
    exclude-filter: "(?i)(倍率|剩余|到期|官网|流量|3x|5x|Traffic|Expire)"

  - name: "AI"
    type: select
    include-all-proxies: true
    filter: "(?i)日本|台湾|新加坡|JP|TW|SG|狮城|🇯🇵|🇹🇼|🇸🇬"
    exclude-filter: "(?i)(倍率|剩余|到期|官网|流量|3x|5x|Traffic|Expire)"
    proxies:
      - "AI-自动测速"

  - name: "AI-自动测速"
    type: url-test
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    include-all-proxies: true
    filter: "(?i)日本|台湾|新加坡|JP|TW|SG|狮城|🇯🇵|🇹🇼|🇸🇬"
    exclude-filter: "(?i)(倍率|剩余|到期|官网|流量|3x|5x|Traffic|Expire)"

rules:
  # 1. 核心基础设施
  - DOMAIN-SUFFIX,github.com,节点选择
  - DOMAIN-SUFFIX,githubusercontent.com,节点选择
  - DOMAIN-SUFFIX,jsdelivr.net,节点选择
  - DOMAIN-KEYWORD,github,节点选择

  # 2. 海外 AI 专项（单条正则 + Google AI 补充，走日台新）
  - DOMAIN-REGEX,^(.+\.)?(openai|chatgpt|oaistatic|oaiusercontent|sora|gemini|aistudio|anthropic|claude|perplexity|copilot)\.(com|ai|dev|net|org)$,AI
  - DOMAIN-SUFFIX,generativelanguage.googleapis.com,AI
  - GEOSITE,google-gemini,AI

  # 3. 国内域名与 IP 直连
  - GEOSITE,CN,DIRECT
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT

  # 4. 兜底规则
  - MATCH,节点选择
