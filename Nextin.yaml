x-nextin:
  version: 1
  mode: template

proxies: []

proxy-groups:
  - name: "节点选择"
    type: select
    include-all-proxies: true
    filter: "(?i)香港|日本|台湾|新加坡|HK|JP|TW|SG|狮城"
    exclude-filter: "(?i)(倍率|剩余|到期|官网|流量|3x|5x|Traffic|Expire)"
    proxies:
      - "港日台新-全自动"
      - "日台新-自动"
      - "香港-自动"
      - "日本-自动"
      - "台湾-自动"
      - "新加坡-自动"
      - "DIRECT"

  - name: "港日台新-全自动"
    type: url-test
    include-all-proxies: true
    filter: "(?i)香港|日本|台湾|新加坡|狮城|HK|hk|JP|jp|TW|tw|SG|sg"
    exclude-filter: "(?i)(倍率|剩余|到期|官网|流量|3x|5x|Traffic|Expire)"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "日台新-自动"
    type: url-test
    include-all-proxies: true
    filter: "(?i)日本|台湾|新加坡|狮城|JP|jp|TW|tw|SG|sg"
    exclude-filter: "(?i)(倍率|剩余|到期|官网|流量|3x|5x|Traffic|Expire)"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "香港-自动"
    type: url-test
    include-all-proxies: true
    filter: "(?i)香港|HK|hk"
    exclude-filter: "(?i)(倍率|剩余|到期|官网|流量|3x|5x|Traffic|Expire)"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    
  - name: "日本-自动"
    type: url-test
    include-all-proxies: true
    filter: "(?i)日本|JP|jp"
    exclude-filter: "(?i)(倍率|剩余|到期|官网|流量|3x|5x|Traffic|Expire)"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "台湾-自动"
    type: url-test
    include-all-proxies: true
    filter: "(?i)台湾|TW|tw"
    exclude-filter: "(?i)(倍率|剩余|到期|官网|流量|3x|5x|Traffic|Expire)"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50


  - name: "新加坡-自动"
    type: url-test
    include-all-proxies: true
    filter: "(?i)新加坡|狮城|SG|🇸🇬"
    exclude-filter: "(?i)(倍率|剩余|到期|官网|流量|3x|5x|Traffic|Expire)"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "Spotify"
    type: select
    proxies:
      - "新加坡-自动"
      - "节点选择"

  - name: "AI"
    type: select
    proxies:
      - "日台新-自动"
      - "节点选择"

rules:
  # Spotify流量分流
  - GEOSITE,spotify,Spotify
  - DOMAIN-SUFFIX,spotify.com,Spotify
  - DOMAIN-KEYWORD,spotify,Spotify

  # 国外AI流量分流
  - GEOSITE,openai,AI
  - DOMAIN-SUFFIX,openai.com,AI
  - DOMAIN-SUFFIX,chatgpt.com,AI
  - GEOSITE,google-gemini,AI
  - DOMAIN-SUFFIX,gemini.google.com,AI
  - DOMAIN-KEYWORD,gemini,AI
  - GEOSITE,anthropic,AI
  - DOMAIN-SUFFIX,claude.ai,AI
  
  # 基础流量分流
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - GEOSITE,CN,DIRECT
  - MATCH,节点选择
